<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Katana cursor, generated from the user's katana design</title>
  <g transform="rotate(-45 64 64)">
    <!-- Blade, tapered to a point, black with a light edge so it reads on dark backgrounds -->
    <polygon points="58,64 70,64 70,22 64,6 58,22" fill="#0b0b0f" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="64" y1="10" x2="64" y2="62" stroke="#e5e7eb" stroke-width="1" opacity="0.7"/>
    <!-- Guard (tsuba) -->
    <ellipse cx="64" cy="67" rx="14" ry="5" fill="#111827" stroke="#d1d5db" stroke-width="1.5"/>
    <!-- Handle, black with the diamond wrapping from the design -->
    <rect x="57" y="72" width="14" height="50" rx="3" fill="#0b0b0f" stroke="#d1d5db" stroke-width="1"/>
    <g fill="#f8fafc">
      <polygon points="64,76 68,80 64,84 60,80"/>
      <polygon points="64,86 68,90 64,94 60,90"/>
      <polygon points="64,96 68,100 64,104 60,100"/>
      <polygon points="64,106 68,110 64,114 60,110"/>
    </g>
    <g fill="none" stroke="#f8fafc" stroke-width="0.8" opacity="0.6">
      <line x1="57" y1="80" x2="71" y2="88"/>
      <line x1="71" y1="80" x2="57" y2="88"/>
      <line x1="57" y1="90" x2="71" y2="98"/>
      <line x1="71" y1="90" x2="57" y2="98"/>
      <line x1="57" y1="100" x2="71" y2="108"/>
      <line x1="71" y1="100" x2="57" y2="108"/>
    </g>
    <!-- Pommel cap -->
    <rect x="57" y="118" width="14" height="5" rx="2" fill="#111827" stroke="#d1d5db" stroke-width="1"/>
  </g>
</svg>
